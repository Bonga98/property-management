spring.application.name=property-management

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/pmsdb-test
spring.datasource.username=root
spring.datasource.password=

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keeps existing data and tables on server restart
spring.jpa.hibernate.ddl-auto=update

# Prints SQL queries generated by Hibernate in console
spring.jpa.show-sql=true

# MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect