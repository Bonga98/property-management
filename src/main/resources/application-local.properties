pms.dummy = This is a dummy a value for local

spring.application.name=property-management
#Allow H2 DB to be accessed via browser and via Java application
spring.h2.console.enabled=true
#database server path
spring.h2.console.path=/h2-console
#DB url and DB name (pmsdb)
spring.datasource.url = jdbc:h2:file:~/h2/pmsdb
spring.datasource.username = sa
#DB password
spring.datasource.password=
#DB driver
spring.datasource.driverClassName = org.h2.Driver
#Tells to keep existing data and table while the server restart, other value is create where the existing data is dropped on server restart
spring.jpa.hibernate.ddl-auto = update
#This enables printing of sql queries generated by hibernate in console
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.H2Dialect